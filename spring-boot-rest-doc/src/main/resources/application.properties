# Nothing here is REST Docs related, and that is the point. REST Docs is a test-time concern,
# it needs no runtime configuration and adds nothing to the running application.
#
# The generated documentation is served as an ordinary static resource from
# classpath:/static/docs/index.html, which Spring Boot maps to /docs/index.html with no
# configuration at all. See the maven-resources-plugin "copy-docs" execution in pom.xml for
# how it gets there.
spring.application.name=spring-boot-rest-doc
